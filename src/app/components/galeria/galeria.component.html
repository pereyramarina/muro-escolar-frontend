<div class="galeria-container">
  <h2>Galería de Arte de los Alumnos</h2>
  <p>Explora los trabajos multimedia registrados en el sistema.</p>

  <div *ngIf="esAlumno" class="card" style="margin-bottom: 30px; padding: 20px; background-color: #f8f9fa;">
    <h3 style="margin-top: 0; color: #333;">Publicar Nueva Obra</h3>
    
    <form [formGroup]="obraForm" (ngSubmit)="guardarObra()" style="display: flex; gap: 15px; flex-wrap: wrap; align-items: center;">
      
      <div style="flex: 1; min-width: 200px;">
        <input type="text" formControlName="titulo" placeholder="Título de la obra" style="width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #ccc;">
      </div>

      <div style="flex: 1; min-width: 200px;">
        <input type="text" formControlName="alumnoId" placeholder="Tu ID o Legajo" style="width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #ccc;">
      </div>

      <div style="flex: 2; min-width: 300px;">
        <input type="text" formControlName="imagenUrl" placeholder="URL de la imagen (ej: https://...)" style="width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #ccc;">
      </div>

      <div style="flex: 100%;">
        <input type="text" formControlName="descripcion" placeholder="Descripción breve o técnica utilizada" style="width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #ccc;">
      </div>
      
      <button type="submit" class="btn-primary" [disabled]="obraForm.invalid" style="padding: 10px 25px;">
        Subir al Muro
      </button>
      
    </form>
  </div>
  <div class="galeria-grid">
    
    <div *ngFor="let obra of obras" class="card obra-card">
      
      <img [src]="obra.imagenUrl" 
           (error)="obra.imagenUrl = 'https://images.unsplash.com/photo-1460661419201-fd4cecdf8a8b?w=500&q=80'"
           [alt]="'Obra: ' + obra.titulo" 
           class="obra-img">

      <h3 style="margin-top: 0;">{{ obra.titulo }}</h3>
      
      <p style="margin-bottom: 15px;">
        <strong>ID Alumno:</strong> {{ obra.alumnoId }}
      </p>
      
      <div style="margin-top: auto;">
        <span class="tecnica-badge">
          {{ obra.descripcion }}
        </span>
      </div>

      <a [routerLink]="['/feedback', obra._id]" class="btn-primary" style="margin-top: 15px;">
        Ver / Calificar
      </a>
    </div>

  </div>
  <div *ngIf="obras.length === 0" class="card" style="text-align: center;">
    <p>No hay obras registradas para mostrar en este momento.</p>
  </div>

</div>
