<div class="login-wrapper">
  <div class="login-card">
    <h2>Muro Escolar</h2>
    <p>Ingresa tus credenciales para acceder</p>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      
      <div class="form-group">
        <label for="email">Correo Electrónico (Gmail)</label>
        <input 
          type="email" 
          id="email" 
          formControlName="email" 
          placeholder="alumno@gmail.com"
        >
      </div>

      <div class="form-group">
        <label for="dni">DNI (Contraseña)</label>
        <input 
          type="password" 
          id="dni" 
          formControlName="dni" 
          placeholder="Ingresa tu DNI sin puntos"
        >
      </div>

      <div class="error-box" *ngIf="mensajeError">
        {{ mensajeError }}
      </div>

      <button type="submit" [disabled]="loginForm.invalid">
        Iniciar Sesión
      </button>
    </form>
  </div>
</div>
