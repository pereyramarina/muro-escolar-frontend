<div class="dashboard-container">
  <h2>Panel de Analíticas</h2>
  
  <button (click)="exportarPDF()" class="btn-primary" style="margin-bottom: 20px;">
    Exportar Informe PDF
  </button>

  <div *ngIf="metricas" class="card" id="dashboard-reporte">
    <h3>Resumen General</h3>
    <div class="stats-grid">
      <div class="stat-box">Obras: <strong>{{ metricas.totalObras }}</strong></div>
      <div class="stat-box">Feedbacks: <strong>{{ metricas.totalFeedbacks }}</strong></div>
      <div class="stat-box">Alumnos: <strong>{{ metricas.alumnosActivos }}</strong></div>
    </div>

    <h3 style="margin-top: 20px;">Distribución por Técnica</h3>
    <div class="data-list">
      <div *ngFor="let item of metricas.desgloseTecnicas" class="data-item">
        <span>{{ item.tecnica }}</span>
        <strong>{{ item.cantidad }} ({{ item.porcentaje }}%)</strong>
      </div>
    </div>
  </div>

  <div *ngIf="!metricas" class="card">
    <p>Cargando datos analíticos...</p>
  </div>
</div>
