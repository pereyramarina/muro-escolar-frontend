<div class="dashboard-container">
  <h2>Panel de Analíticas</h2>
  
  <button (click)="exportarPDF()" class="btn-primary no-print" style="margin-bottom: 20px;">
    📄 Exportar Informe PDF
  </button>

  <div *ngIf="metricas" class="card" id="dashboard-reporte">
    <h3>Resumen General</h3>
    
    <div class="stats-grid">
      <div class="stat-box">Obras: <strong>{{ metricas.totalObras }}</strong></div>
      <div class="stat-box">Feedbacks: <strong>{{ metricas.totalFeedbacks }}</strong></div>
      <div class="stat-box">Alumnos: <strong>{{ metricas.alumnosActivos }}</strong></div>
    </div>

    <h3 style="margin-top: 20px;">Distribución por Técnica</h3>
    <div class="data-list">
      
      <div *ngFor="let item of metricas.desgloseTecnicas" class="data-item" style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; padding: 10px 0; border-bottom: 1px solid #f0f0f0;">
        
        <span style="flex: 1; font-weight: 500; color: #333;">{{ item.tecnica }}</span>
        
        <div class="progress-track no-print" style="flex: 2; height: 10px; background-color: #e9ecef; border-radius: 5px; margin: 0 15px; overflow: hidden;">
          <div [style.width.%]="item.porcentaje" style="height: 100%; background-color: #3498db; transition: width 0.5s ease;"></div>
        </div>

        <span style="flex: 1; text-align: right; color: #555;">
          <strong>{{ item.cantidad }}</strong> obras ({{ item.porcentaje }}%)
        </span>
        
      </div>
      
    </div>
  </div>

  <div *ngIf="!metricas" class="card" style="text-align: center; color: #666;">
    <p>Cargando datos analíticos...</p>
  </div>
</div>
